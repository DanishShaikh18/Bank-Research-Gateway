<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Research Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header span { font-size: 12px; color: #64748b; margin-left: auto; }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 780px;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 90%;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .msg.user .avatar { background: #6366f1; }
    .msg.bot  .avatar { background: #1e293b; border: 1px solid #2d3148; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #6366f1;
      border-radius: 12px 2px 12px 12px;
    }

    .msg.bot .bubble {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 2px 12px 12px 12px;
    }

    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #64748b;
      border-radius: 50%;
      animation: blink 1.2s infinite;
      margin: 0 2px;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

    #input-bar {
      width: 100%;
      max-width: 780px;
      padding: 12px 16px 20px;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
    }

    #input:focus { border-color: #6366f1; }

    #send {
      background: #6366f1;
      border: none;
      border-radius: 10px;
      width: 44px; height: 44px;
      cursor: pointer;
      color: white;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send:hover { background: #4f46e5; }
    #send:disabled { background: #2d3148; cursor: not-allowed; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: #475569;
    }
    .empty-state h2 { font-size: 20px; margin-bottom: 8px; color: #94a3b8; }
    .empty-state p  { font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🏦</div>
  <h1>Bank Research Gateway</h1>
  <span>Internal Policy &amp; Market Research Assistant</span>
</header>

<div id="chat">
  <div class="empty-state">
    <h2>Ask me anything</h2>
    <p>I can search internal bank policies or research public market data.</p>
  </div>
</div>

<div id="input-bar">
  <textarea id="input" placeholder="Ask about policies, compliance, market research…" rows="1"></textarea>
  <button id="send">&#9650;</button>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMsg(role, text) {
    // Remove empty state on first message
    const es = chatEl.querySelector('.empty-state');
    if (es) es.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${text}</div>`;
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-indicator';
    msg.innerHTML = `<div class="avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = '44px';
    sendBtn.disabled = true;

    addMsg('user', text);
    addTyping();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 180000); // 3 min

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      const data = await res.json();
      removeTyping();
      addMsg('bot', data.response || 'No response.');
    } catch (err) {
      clearTimeout(timeout);
      removeTyping();
      if (err.name === 'AbortError') {
        addMsg('bot', '⏱️ Request timed out. The server may be overloaded — try again in a minute.');
      } else {
        addMsg('bot', '⚠️ Could not reach the server. Make sure the backend is running.');
      }
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = '44px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
</script>

</body>
</html>
